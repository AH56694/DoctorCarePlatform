events {}

http {
  server_tokens off;
  client_max_body_size 10m;
  client_body_timeout 15s;
  send_timeout 30s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=ai:10m rate=20r/m;
  limit_req_status 429;
  log_format operational '$request_id $request_method $status $request_time';
  access_log /var/log/nginx/access.log operational;
  upstream backend {
    server backend:8000;
  }

  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location ~ ^/api/v1/accounts/(login|register)/?$ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/api/v1/ai/chat(/stream)?/?$ {
      limit_req zone=ai burst=5 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 150s;
    }

    location = /health {
      proxy_pass http://backend;
    }

    location = /ready {
      proxy_pass http://backend;
    }

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 150s;
    }

    location / {
      proxy_pass http://frontend;
    }
  }
}
