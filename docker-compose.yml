name: doctorcareplatform

services:
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-DoctorCarePlatform}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://medical_app:change-me@postgres:5432/doctor_care_platform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://python-service:8300}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
    depends_on:
      - postgres
      - redis
      - minio
      - python-service
    ports:
      - "8000:8000"

  python-service:
    build:
      context: .
      dockerfile: python-service/Dockerfile
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      EMBEDDING_MODEL: ${PYTHON_SERVICE_EMBEDDING_MODEL:-local}
      LOCAL_EMBEDDING_MODEL_PATH: ${LOCAL_EMBEDDING_MODEL_PATH:-/app/models/bge-small-zh-v1.5}
      USE_MILVUS: ${USE_MILVUS:-false}
      VECTOR_STORE_PERSIST_DIR: ${VECTOR_STORE_PERSIST_DIR:-/app/faiss_index}
      VECTOR_STORE_COLLECTION_NAME: ${VECTOR_STORE_COLLECTION_NAME:-doctorcare_medical_knowledge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_knowledge_db}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    depends_on:
      - redis
    ports:
      - "8300:8300"
    volumes:
      - python-service-faiss:/app/faiss_index

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
      - python-service
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctor_care_platform}
      POSTGRES_USER: ${POSTGRES_USER:-medical_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
  python-service-faiss:
